<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Tea Houses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf6ef;
      --parchment: #f0e8d8;
      --tea-green: #4a7c59;
      --tea-dark: #2d5a3d;
      --tea-light: #a8c9b0;
      --gold: #c9943a;
      --gold-light: #e8c97a;
      --ink: #1a1a14;
      --ink-muted: #5a5548;
      --water: #8bb4c8;
      --water-light: #b8d4e4;
      --ocean: #6a9fb5;
      --land: #c8d8a8;
      --land-hover: #b8cc95;
      --shadow: rgba(26,26,20,0.15);
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      height: 64px;
      background: var(--cream);
      border-bottom: 1px solid rgba(26,26,20,0.12);
    }
    .header-title {
      display: flex; align-items: baseline; gap: 10px;
    }
    .header-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 600;
      color: var(--ink); letter-spacing: 0.01em;
    }
    .header-title span {
      font-size: 13px; color: var(--ink-muted); font-weight: 300;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .header-right {
      display: flex; align-items: center; gap: 8px;
    }
    .filter-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 400;
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid rgba(26,26,20,0.2);
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--tea-green); color: var(--tea-green); }
    .filter-btn.active {
      background: var(--tea-green); border-color: var(--tea-green);
      color: #fff;
    }

    /* ── Map ── */
    #map-wrap {
      position: fixed;
      top: 64px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: var(--water-light);
      cursor: grab;
    }
    #map-wrap:active { cursor: grabbing; }
    #map-stage {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      transform-origin: 0 0;
      will-change: transform;
    }
    svg#world-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
    }
    /* subtle ocean texture via repeating pattern */
    .ocean-bg {
      fill: var(--water-light);
    }
    .country-path {
      fill: var(--land);
      stroke: #fff;
      stroke-width: 0.5px;
      transition: fill 0.1s;
    }

    /* ── Pins ── */
    .tea-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
    }
    .tea-pin:hover { transform: translate(-50%, -50%) scale(1.45); z-index: 20; }
    .tea-pin.active { transform: translate(-50%, -50%) scale(1.5); z-index: 30; }
    .pin-icon {
      font-size: 20px;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25));
      line-height: 1;
    }
    .pin-pulse {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: rgba(74,124,89,0.2);
      animation: pulse 2.4s ease-out infinite;
      pointer-events: none;
    }
    @keyframes pulse {
      0% { transform: scale(0.7); opacity: 0.7; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* ── Tooltip ── */
    .tooltip {
      position: fixed;
      z-index: 500;
      background: var(--cream);
      border: 1px solid rgba(26,26,20,0.12);
      border-radius: 12px;
      padding: 16px 18px;
      width: 260px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.15s, transform 0.15s;
      box-shadow: 0 8px 32px rgba(26,26,20,0.12);
    }
    .tooltip.visible { opacity: 1; transform: translateY(0); }
    .tooltip-icon { font-size: 26px; margin-bottom: 8px; display: block; }
    .tooltip h3 {
      font-family: 'Playfair Display', serif;
      font-size: 15px; font-weight: 600; color: var(--ink);
      margin-bottom: 3px; line-height: 1.3;
    }
    .tooltip .city {
      font-size: 11px; color: var(--gold); font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-bottom: 8px;
    }
    .tooltip p {
      font-size: 12px; color: var(--ink-muted); line-height: 1.55;
      margin-bottom: 10px;
    }
    .tooltip-tags {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .tag {
      font-size: 10px; padding: 2px 9px;
      border-radius: 999px;
      background: rgba(74,124,89,0.1);
      color: var(--tea-dark);
      border: 1px solid rgba(74,124,89,0.2);
    }

    /* ── Controls ── */
    .map-controls {
      position: fixed; bottom: 28px; left: 28px;
      z-index: 200;
      display: flex; flex-direction: column; gap: 6px;
    }
    .ctrl-btn {
      width: 36px; height: 36px;
      background: var(--cream);
      border: 1px solid rgba(26,26,20,0.15);
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--ink);
      transition: background 0.1s;
      font-family: 'DM Sans', sans-serif;
    }
    .ctrl-btn:hover { background: var(--parchment); }

    /* ── Counter ── */
    .counter {
      position: fixed; bottom: 28px; right: 28px;
      z-index: 200;
      background: var(--cream);
      border: 1px solid rgba(26,26,20,0.12);
      border-radius: 10px;
      padding: 10px 18px;
      text-align: center;
    }
    .counter-num {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 600; color: var(--tea-green);
      line-height: 1;
    }
    .counter-label {
      font-size: 10px; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-top: 2px;
    }

    /* ── Legend ── */
    .legend {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 200;
      background: var(--cream);
      border: 1px solid rgba(26,26,20,0.12);
      border-radius: 10px;
      padding: 8px 16px;
      display: flex; gap: 16px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--ink-muted);
    }
    .legend-icon { font-size: 14px; }

    /* ── Intro overlay ── */
    #intro {
      position: fixed; inset: 0; z-index: 999;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      opacity: 1; transition: opacity 0.6s;
    }
    #intro.hidden { opacity: 0; pointer-events: none; }
    #intro .big-icon { font-size: 56px; }
    #intro h2 {
      font-family: 'Playfair Display', serif;
      font-size: 32px; font-weight: 600; color: var(--ink);
    }
    #intro p { font-size: 14px; color: var(--ink-muted); }
  </style>
</head>
<body>

<!-- Intro splash -->
<div id="intro">
  <div class="big-icon">🍵</div>
  <h2>World Tea Houses</h2>
  <p>Loading the map…</p>
</div>

<!-- Header -->
<header>

  <div class="header-right" id="filter-bar"></div>

<!-- Map -->
<div id="map-wrap">

</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

<!-- Controls -->
<div class="map-controls">

  <button class="ctrl-btn" id="zoom-out" title="Zoom out">−</button>

/* ────────────────────────────────────────────────
   STATE
──────────────────────────────────────────────── */
const categories = [...new Set(teaHouses.map(t => t.type))];
let activeFilter = "All";
let zoom = 1, panX = 0, panY = 0;
let isDragging = false, dragStart = {x:0,y:0}, panStart = {x:0,y:0};
let activePin = null;

const mapWrap   = document.getElementById('map-wrap');
const mapStage  = document.getElementById('map-stage');
const worldSvg  = document.getElementById('world-svg');
const tooltipEl = document.getElementById('tooltip');
const shownEl   = document.getElementById('shown-count');
const filterBar = document.getElementById('filter-bar');
const intro     = document.getElementById('intro');

/* ────────────────────────────────────────────────
   HELPERS
──────────────────────────────────────────────── */
function getIcon(type) {
  const icons = { "East Asian":"🍵", "South Asian":"☕", "Middle Eastern":"🫖", "European":"🍶" };
  return icons[type] || "🍵";
}

// Natural Earth projection matching viewBox 0 0 1000 500
const projection = d3.geoNaturalEarth1().scale(153).translate([500, 250]);

function latLngToPct(lat, lng) {
  const [x, y] = projection([lng, lat]);
  return { px: (x / 1000) * 100, py: (y / 500) * 100 };
}

/* ────────────────────────────────────────────────
   ZOOM / PAN
──────────────────────────────────────────────── */
function applyTransform() {
  mapStage.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  mapStage.style.transformOrigin = '0 0';
}

mapWrap.addEventListener('mousedown', e => {
  if (e.target.closest('.tea-pin') || e.target.closest('.ctrl-btn')) return;
  isDragging = true;
  dragStart = {x: e.clientX, y: e.clientY};
  panStart  = {x: panX, y: panY};
  mapWrap.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX = panStart.x + (e.clientX - dragStart.x);
  panY = panStart.y + (e.clientY - dragStart.y);
  applyTransform();
});
window.addEventListener('mouseup', () => { isDragging = false; mapWrap.style.cursor = 'grab'; });

mapWrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 1.15 : 0.87;
  zoom = Math.min(Math.max(zoom * delta, 1), 7);
  if (zoom === 1) { panX = 0; panY = 0; }
  applyTransform();
}, { passive: false });

// Touch support
let lastTouchDist = null;
mapWrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    panStart  = {x: panX, y: panY};
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});
mapWrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    panX = panStart.x + (e.touches[0].clientX - dragStart.x);
    panY = panStart.y + (e.touches[0].clientY - dragStart.y);
    applyTransform();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastTouchDist) {
      zoom = Math.min(Math.max(zoom * (dist / lastTouchDist), 1), 7);
      applyTransform();
    }
    lastTouchDist = dist;
  }
}, { passive: false });
mapWrap.addEventListener('touchend', () => { isDragging = false; lastTouchDist = null; });

document.getElementById('zoom-in').onclick    = () => { zoom = Math.min(zoom * 1.4, 7); applyTransform(); };
document.getElementById('zoom-out').onclick   = () => { zoom = Math.max(zoom / 1.4, 1); if (zoom === 1) { panX=0; panY=0; } applyTransform(); };
document.getElementById('zoom-reset').onclick = () => { zoom=1; panX=0; panY=0; applyTransform(); };

/* ────────────────────────────────────────────────
   TOOLTIP
──────────────────────────────────────────────── */
function showTooltip(tea, pinEl) {
  if (activePin) activePin.classList.remove('active');
  activePin = pinEl;
  pinEl.classList.add('active');

  tooltipEl.innerHTML = `
    <span class="tooltip-icon">${getIcon(tea.type)}</span>
    <h3>${tea.name}</h3>
    <div class="city">${tea.city}</div>
    <p>${tea.desc}</p>
    <div class="tooltip-tags">${tea.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
  `;

  const r = pinEl.getBoundingClientRect();
  let left = r.right + 10;
  let top  = r.top - 20;

  tooltipEl.style.display = 'block';
  tooltipEl.classList.remove('visible');
  const tw = tooltipEl.offsetWidth;
  const th = tooltipEl.offsetHeight;

  if (left + tw > window.innerWidth - 10) left = r.left - tw - 10;
  if (top + th > window.innerHeight - 10) top = window.innerHeight - th - 10;
  if (top < 70) top = 70;

  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top  = top + 'px';
  requestAnimationFrame(() => tooltipEl.classList.add('visible'));
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
  if (activePin) { activePin.classList.remove('active'); activePin = null; }
}

mapWrap.addEventListener('click', e => {
  if (!e.target.closest('.tea-pin')) hideTooltip();
});

/* ────────────────────────────────────────────────
   FILTERS
──────────────────────────────────────────────── */
function buildFilters() {
  const all = document.createElement('button');
  all.className = 'filter-btn active';
  all.textContent = 'All';
  all.onclick = () => setFilter('All', all);
  filterBar.appendChild(all);

  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = cat;
    btn.onclick = () => setFilter(cat, btn);
    filterBar.appendChild(btn);
  });
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  let count = 0;
  document.querySelectorAll('.tea-pin').forEach(pin => {
    const show = (cat === 'All' || pin.dataset.type === cat);
    pin.style.display = show ? 'flex' : 'none';
    if (show) count++;
  });
  shownEl.textContent = count;
  hideTooltip();
}

/* ────────────────────────────────────────────────
   PINS
──────────────────────────────────────────────── */
function buildPins() {
  teaHouses.forEach(tea => {
    const { px, py } = latLngToPct(tea.lat, tea.lng);
    const pin = document.createElement('div');
    pin.className = 'tea-pin';
    pin.dataset.type = tea.type;
    pin.style.left = px + '%';
    pin.style.top  = py + '%';

    const pulse = document.createElement('div');
    pulse.className = 'pin-pulse';
    pin.appendChild(pulse);

    const icon = document.createElement('span');
    icon.className = 'pin-icon';
    icon.textContent = getIcon(tea.type);
    pin.appendChild(icon);

    pin.onclick = e => {
      e.stopPropagation();
      if (activePin === pin) { hideTooltip(); return; }
      showTooltip(tea, pin);
    };

    mapStage.appendChild(pin);
  });
}

/* ────────────────────────────────────────────────
   MAP LOAD
──────────────────────────────────────────────── */
async function loadMap() {
  try {
    const res   = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    const world = await res.json();
    const countries = topojson.feature(world, world.objects.countries);
    const path  = d3.geoPath().projection(projection);
    const g     = document.createElementNS('http://www.w3.org/2000/svg','g');

    countries.features.forEach(f => {
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', path(f));
      p.setAttribute('class', 'country-path');
      g.appendChild(p);
    });
    worldSvg.appendChild(g);
  } catch (err) {
    console.warn('Map tiles failed to load:', err);
  }

  buildPins();
  buildFilters();

  setTimeout(() => intro.classList.add('hidden'), 600);
}

loadMap();
</script>
</body>
