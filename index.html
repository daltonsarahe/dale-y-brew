<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>World Tea Houses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #faf6ef; --parchment: #f0e8d8; --tea-green: #4a7c59; --tea-dark: #2d5a3d;
      --tea-light: #a8c9b0; --gold: #c9943a; --gold-light: #e8c97a; --ink: #1a1a14;
      --ink-muted: #5a5548; --water: #8bb4c8; --water-light: #b8d4e4; --ocean: #6a9fb5;
      --land: #c8d8a8; --land-hover: #b8cc95; --shadow: rgba(26,26,20,0.15);
    }
    html, body { width: 100%; height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); overflow: hidden; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 15px; height: auto; min-height: 64px; background: var(--cream);
      border-bottom: 1px solid rgba(26,26,20,0.12); flex-wrap: wrap; gap: 10px; padding-bottom: 10px;
    }
    .header-title { display: flex; align-items: baseline; gap: 10px; }
    .header-title h1 { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; color: var(--ink); }
    .header-right { display: flex; align-items: center; gap: 8px; overflow-x: auto; width: 100%; padding-bottom: 5px; }
    
    .filter-btn {
      font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 14px;
      border-radius: 999px; border: 1px solid rgba(26,26,20,0.2); background: transparent;
      color: var(--ink-muted); cursor: pointer; white-space: nowrap; transition: all 0.15s;
    }
    .filter-btn.active { background: var(--tea-green); border-color: var(--tea-green); color: #fff; }

    #map-wrap { position: fixed; top: 64px; left: 0; right: 0; bottom: 0; overflow: hidden; background: var(--water-light); cursor: grab; }
    #map-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
    svg#world-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .country-path { fill: var(--land); stroke: #fff; stroke-width: 0.5px; }

    .tea-pin { position: absolute; transform: translate(-50%, -50%); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: transform 0.15s; }
    .pin-icon { font-size: 20px; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25)); }
    .pin-pulse { position: absolute; inset: 0; border-radius: 50%; background: rgba(74,124,89,0.2); animation: pulse 2.4s infinite; pointer-events: none; }
    @keyframes pulse { 0% { transform: scale(0.7); opacity: 0.7; } 100% { transform: scale(2); opacity: 0; } }

    .tooltip {
      position: fixed; z-index: 500; background: var(--cream); border: 1px solid rgba(26,26,20,0.12);
      border-radius: 12px; padding: 20px; box-shadow: 0 -4px 32px rgba(26,26,20,0.15);
      width: 100% !important; left: 0 !important; bottom: 0 !important; top: auto !important;
      border-bottom-left-radius: 0; border-bottom-right-radius: 0;
      transform: translateY(100%); transition: transform 0.3s ease-out, opacity 0.3s; opacity: 0;
    }
    .tooltip.visible { transform: translateY(0); opacity: 1; }
    .tooltip-icon { font-size: 26px; margin-bottom: 8px; display: block; }

    .map-controls { position: fixed; bottom: 15px; left: 15px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
    .ctrl-btn { width: 36px; height: 36px; background: var(--cream); border: 1px solid rgba(26,26,20,0.15); border-radius: 8px; cursor: pointer; }
    .counter { position: fixed; bottom: 15px; right: 15px; z-index: 200; background: var(--cream); border: 1px solid rgba(26,26,20,0.12); border-radius: 10px; padding: 8px 12px; text-align: center; }
    .legend { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 200; background: var(--cream); border: 1px solid rgba(26,26,20,0.12); border-radius: 10px; padding: 8px 16px; display: flex; gap: 12px; width: 90%; overflow-x: auto; }
    
    @media (min-width: 768px) {
      header { height: 64px; flex-wrap: nowrap; padding: 0 28px; }
      .tooltip { width: 280px !important; bottom: auto !important; border-radius: 12px; transform: translateY(6px); }
      .legend { width: auto; bottom: 28px; }
    }
    #intro { position: fixed; inset: 0; z-index: 999; background: var(--cream); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; transition: opacity 0.6s; }
    #intro.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

<div id="intro">
  <div style="font-size: 56px;">🍵</div>
  <h2 style="font-family: 'Playfair Display', serif; font-size: 32px;">World Tea Houses</h2>
  <p>Loading the map…</p>
</div>

<header>
  <div class="header-title">
    <h1>🍵 World Tea Houses</h1>
    <span id="dest-count">36 destinations</span>
  </div>
  <div class="header-right" id="filter-bar"></div>
</header>

<div id="map-wrap">
  <div id="map-stage">
    <svg id="world-svg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <rect fill="var(--water-light)" width="1000" height="500"/>
    </svg>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="map-controls">
  <button class="ctrl-btn" id="zoom-in">+</button>
  <button class="ctrl-btn" id="zoom-out">−</button>
  <button class="ctrl-btn" id="zoom-reset">⌂</button>
</div>

<div class="counter">
  <div class="counter-num" id="shown-count">36</div>
  <div class="counter-label">tea houses</div>
</div>

<div class="legend">
  <div class="legend-item"><span>🍵</span> East Asian</div>
  <div class="legend-item"><span>☕</span> South Asian</div>
  <div class="legend-item"><span>🫖</span> Middle Eastern</div>
  <div class="legend-item"><span>🍶</span> European</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
const teaHouses = [
  { "name":"Wangfujing Teahouse", "city":"Beijing, China", "lat":39.9138, "lng":116.4117, "type":"East Asian", "desc":"A grand multi-story teahouse in Beijing's famous shopping street, hosting traditional gongfu cha ceremonies." },
  { "name":"Ten Fu Tea", "city":"Shanghai, China", "lat":31.2304, "lng":121.4737, "type":"East Asian", "desc":"One of Shanghai's most beloved chain teahouses, celebrated for Longjing green tea and dim sum pairings." },
  { "name":"Urasenke Chado", "city":"Kyoto, Japan", "lat":35.0345, "lng":135.7534, "type":"East Asian", "desc":"The ancestral home of the Urasenke school of Japanese tea ceremony, dating back to the 17th century." },
  { "name":"Nakamura-ro Teahouse", "city":"Kyoto, Japan", "lat":35.0036, "lng":135.7785, "type":"East Asian", "desc":"Japan's oldest teahouse, founded in 1465, nestled beside the Kitano Tenmangu shrine." },
  { "name":"Osulloc Tea Museum", "city":"Jeju, South Korea", "lat":33.3059, "lng":126.2895, "type":"East Asian", "desc":"Sitting amid lush green tea fields, this museum-café celebrates Korean green tea culture with panoramic views." },
  { "name":"Yongsan Tea Museum", "city":"Seoul, South Korea", "lat":37.5326, "lng":126.9900, "type":"East Asian", "desc":"A serene urban teahouse in Seoul showcasing Korean traditional tea rituals and antique pottery." },
  { "name":"Maokong Gondola Teahouse", "city":"Taipei, Taiwan", "lat":24.9681, "lng":121.5883, "type":"East Asian", "desc":"Perched high in the mountains reachable by gondola, famous for Tieguanyin oolong grown on the very hillside." },
  { "name":"Pinglin Tea Museum", "city":"New Taipei, Taiwan", "lat":24.9366, "lng":121.7111, "type":"East Asian", "desc":"Located in Taiwan's premier tea-growing region, featuring interactive exhibits on oolong production." },
  { "name":"Dilmah T-Lounge", "city":"Colombo, Sri Lanka", "lat":6.9328, "lng":79.8437, "type":"South Asian", "desc":"Luxury flagship of Sri Lanka's iconic Dilmah brand, showcasing over 100 Ceylon teas in elegant surroundings." },
  { "name":"Makaibari Tea Garden", "city":"Darjeeling, India", "lat":26.8525, "lng":88.2721, "type":"South Asian", "desc":"The world's first biodynamic tea estate with a heritage bungalow where guests sip Darjeeling first flush." },
  { "name":"Connemara Hotel Tea Room", "city":"Chennai, India", "lat":13.0635, "lng":80.2647, "type":"South Asian", "desc":"Colonial-era grand hotel hosting an opulent afternoon tea with Nilgiri teas and traditional sweets." },
  { "name":"Chaiwala of Mumbai", "city":"Mumbai, India", "lat":18.9322, "lng":72.8335, "type":"South Asian", "desc":"Legendary street-side chai stand that has served spiced masala chai to Mumbaikars for over 60 years." },
  { "name":"Çamlıca Tea Garden", "city":"Istanbul, Turkey", "lat":41.0283, "lng":29.0664, "type":"Middle Eastern", "desc":"High on Çamlıca Hill with sweeping Bosphorus views, this sprawling garden serves the classic tulip-glass çay." },
  { "name":"Souk Al-Mubarakiya Teahouse", "city":"Kuwait City, Kuwait", "lat":29.3732, "lng":47.9734, "type":"Middle Eastern", "desc":"Traditional teahouse in a historic bazaar, pouring strong kahwa and sweet Moroccan mint tea for traders." },
  { "name":"Al Mandaloun Teahouse", "city":"Beirut, Lebanon", "lat":33.8967, "lng":35.5061, "type":"Middle Eastern", "desc":"A refined Lebanese teahouse blending Ottoman heritage with modern design, famous for sage and thyme brews." },
  { "name":"Fairmont Empress", "city":"Victoria, Canada", "lat":48.4218, "lng":-123.3678, "type":"European", "desc":"One of Canada's most iconic hotels, serving world-famous afternoon tea in the Lobby Lounge since 1908." },
  { "name":"Murchie's Tea & Coffee", "city":"Victoria, Canada", "lat":48.4253, "lng":-123.3686, "type":"European", "desc":"Founded in 1894, a beloved Victorian institution serving hundreds of blended teas in a heritage setting." },
  { "name":"Windsor Arms Hotel", "city":"Toronto, Canada", "lat":43.6685, "lng":-79.3912, "type":"European", "desc":"Opened in 1927, this legendary boutique hotel is famous for its Parisian-style tea room and decades of high-society tradition." },
  { "name":"Fairmont Royal York", "city":"Toronto, Canada", "lat":43.6452, "lng":-79.3817, "type":"European", "desc":"A grand Toronto landmark since 1929, hosting a sophisticated afternoon tea tradition in the Clockwork lounge." },
  { "name":"Prince of Wales Hotel", "city":"Niagara-on-the-Lake, Canada", "lat":43.2555, "lng":-79.0717, "type":"European", "desc":"An elegant Victorian hotel offering a renowned traditional tea service in the ornate Drawing Room." },
  { "name":"Fairmont Le Château Frontenac", "city":"Quebec City, Canada", "lat":46.8120, "lng":-71.2050, "type":"European", "desc":"Perched above the St. Lawrence River, this historic castle serves a refined afternoon tea at Place Dufferin." },
  { "name":"Fortnum & Mason", "city":"London, UK", "lat":51.5085, "lng":-0.1382, "type":"European", "desc":"Founded in 1707, the quintessential British tea purveyor with a legendary Diamond Jubilee Tea Salon." },
  { "name":"The Ritz Tea Room", "city":"London, UK", "lat":51.5069, "lng":-0.1416, "type":"European", "desc":"The gold standard for British afternoon tea, with finger sandwiches, scones and clotted cream since 1906." },
  { "name":"Café Hawelka", "city":"Vienna, Austria", "lat":48.2084, "lng":16.3712, "type":"European", "desc":"Iconic Viennese coffeehouse that quietly serves top Assam teas alongside its famous Buchteln pastries." },
  { "name":"Mariage Frères", "city":"Paris, France", "lat":48.8580, "lng":2.3556, "type":"European", "desc":"Established in 1854, the legendary French tea merchant with a salon in Le Marais serving 500+ references." },
  { "name":"Demmers Teehaus", "city":"Vienna, Austria", "lat":48.2110, "lng":16.3644, "type":"European", "desc":"A Viennese institution blending Eastern European tradition with global teas in an art nouveau setting." },
  { "name":"Bettys Tea Room", "city":"Harrogate, UK", "lat":53.9934, "lng":-1.5422, "type":"European", "desc":"A beloved Yorkshire institution since 1919, famed for its Fat Rascal scones and floral afternoon tea." },
  { "name":"Grand Salon du Thé", "city":"Brussels, Belgium", "lat":50.8467, "lng":4.3522, "type":"European", "desc":"A Baroque-style salon in Brussels offering rare single-origin teas alongside handmade Belgian chocolates." },
  { "name":"Greenfields Tea Lounge", "city":"Nairobi, Kenya", "lat":-1.2864, "lng":36.8172, "type":"South Asian", "desc":"A garden tea lounge at the edge of the city, serving freshly-picked Kenyan highland teas from nearby estates." },
  { "name":"Nyungwe Forest Tea Rooms", "city":"Kigali, Rwanda", "lat":-1.9441, "lng":30.0619, "type":"South Asian", "desc":"Rwanda's finest specialty tea served in a lush eco-lodge surrounded by forest, showcasing terroir-driven cups." },
  { "name":"Periyakulam Tea Estate", "city":"Ooty, India", "lat":11.4111, "lng":76.6946, "type":"South Asian", "desc":"A heritage Nilgiri estate bungalow where guests enjoy fresh-picked orange pekoe against misty mountain scenery." },
  { "name":"Zen Tea Garden", "city":"San Francisco, USA", "lat":37.7701, "lng":-122.4673, "type":"East Asian", "desc":"A calm Japanese-inspired teahouse in the Japanese Tea Garden of Golden Gate Park, open since 1894." },
  { "name":"Sung Tea", "city":"Los Angeles, USA", "lat":34.0450, "lng":-118.2389, "type":"East Asian", "desc":"A minimalist LA teahouse specialising in rare single-origin Taiwanese and Chinese teas." },
  { "name":"Tea Chai Té", "city":"Portland, USA", "lat":45.5268, "lng":-122.6984, "type":"East Asian", "desc":"Portland's cozy tea sanctuary with an eclectic menu of global teas, known for its creative tea lattes." },
  { "name":"Chado Tea Room", "city":"Los Angeles, USA", "lat":34.0620, "lng":-118.3758, "type":"East Asian", "desc":"A peaceful LA destination with over 300 teas from around the world, from sencha to Egyptian chamomile." },
  { "name":"Lin's Garden Teahouse", "city":"Chengdu, China", "lat":30.6595, "lng":104.0633, "type":"East Asian", "desc":"A classic Sichuanese teahouse in a courtyard garden, where patrons play mahjong and sip jasmine tea all afternoon." },
  { "name":"Hoshino Resorts KAI", "city":"Hakone, Japan", "lat":35.2324, "lng":139.1069, "type":"East Asian", "desc":"A ryokan tea lounge serving hand-whisked matcha with wagashi sweets against views of Mt. Fuji." },
  { "name":"The Tea Collective", "city":"Melbourne, Australia", "lat":-37.8136, "lng":144.9631, "type":"South Asian", "desc":"Melbourne's premier loose-leaf destination, blending Australian bush botanicals with premium Ceylon teas." },
  { "name":"Jing Tea", "city":"Hong Kong", "lat":22.3193, "lng":114.1694, "type":"East Asian", "desc":"A contemporary Hong Kong teahouse focused on traceable, sustainable teas from small family farms." },
  { "name":"Kissa Tanto", "city":"Vancouver, Canada", "lat":49.2811, "lng":-123.1005, "type":"East Asian", "desc":"A Japanese-Italian hybrid café renowned in Vancouver for its elaborate matcha desserts and rare sencha." },
  { "name":"Pekoe Tea Lounge", "city":"Cape Town, South Africa", "lat":-33.9249, "lng":18.4241, "type":"South Asian", "desc":"A sun-drenched Cape Town lounge celebrating Rooibos and Honeybush alongside world teas." }
];

const categories = [...new Set(teaHouses.map(t => t.type))];
let zoom = 1, panX = 0, panY = 0, isDragging = false, dragStart = {x:0,y:0}, panStart = {x:0,y:0}, activePin = null;

const mapWrap = document.getElementById('map-wrap'), mapStage = document.getElementById('map-stage'), 
      worldSvg = document.getElementById('world-svg'), tooltipEl = document.getElementById('tooltip'),
      shownEl = document.getElementById('shown-count'), filterBar = document.getElementById('filter-bar');

const projection = d3.geoNaturalEarth1();
const geoPath = d3.geoPath().projection(projection);

function getIcon(type) {
  const icons = { "East Asian":"🍵", "South Asian":"☕", "Middle Eastern":"🫖", "European":"🍶" };
  return icons[type] || "🍵";
}

function applyTransform() { mapStage.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`; }

// Pan interactions
mapWrap.onmousedown = e => {
  if (e.target.closest('.tea-pin') || e.target.closest('.ctrl-btn')) return;
  isDragging = true; dragStart = {x: e.clientX, y: e.clientY}; panStart = {x: panX, y: panY};
};
window.onmousemove = e => { if(isDragging) { panX = panStart.x + (e.clientX - dragStart.x); panY = panStart.y + (e.clientY - dragStart.y); applyTransform(); }};
window.onmouseup = () => isDragging = false;

function showTooltip(tea, pinEl) {
  if (activePin) activePin.classList.remove('active');
  activePin = pinEl; pinEl.classList.add('active');
  tooltipEl.innerHTML = `
    <span class="tooltip-icon">${getIcon(tea.type)}</span>
    <h3>${tea.name}</h3>
    <div class="city">${tea.city}</div>
    <p>${tea.desc}</p>
    <button onclick="hideTooltip()" style="margin-top:12px; width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer;" class="mobile-close">Close</button>
  `;
  tooltipEl.style.display = 'block';
  if (window.innerWidth >= 768) {
    const r = pinEl.getBoundingClientRect();
    let left = r.right + 10, top = r.top - 20;
    if (left + 280 > window.innerWidth) left = r.left - 290;
    tooltipEl.style.left = left + 'px'; tooltipEl.style.top = top + 'px';
    if(tooltipEl.querySelector('.mobile-close')) tooltipEl.querySelector('.mobile-close').style.display = 'none';
  } else {
    tooltipEl.style.left = '0'; tooltipEl.style.top = 'auto';
  }
  setTimeout(() => tooltipEl.classList.add('visible'), 10);
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
  if (activePin) activePin.classList.remove('active');
  activePin = null;
}

function buildPins() {
  document.querySelectorAll('.tea-pin').forEach(p => p.remove());
  teaHouses.forEach(tea => {
    const coords = projection([tea.lng, tea.lat]);
    if (coords) {
      const [x, y] = coords;
      const pin = document.createElement('div');
      pin.className = 'tea-pin'; pin.dataset.type = tea.type;
      pin.style.left = (x / 1000 * 100) + '%';
      pin.style.top  = (y / 500 * 100) + '%';
      pin.innerHTML = `<div class="pin-pulse"></div><span class="pin-icon">${getIcon(tea.type)}</span>`;
      pin.onclick = e => { e.stopPropagation(); showTooltip(tea, pin); };
      mapStage.appendChild(pin);
    }
  });
}

function buildFilters() {
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active'; allBtn.textContent = 'All';
  allBtn.onclick = () => setFilter('All', allBtn);
  filterBar.appendChild(allBtn);
  categories.forEach(cat => {
    const b = document.createElement('button'); b.className = 'filter-btn'; b.textContent = cat;
    b.onclick = () => setFilter(cat, b); filterBar.appendChild(b);
  });
}

function setFilter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  let count = 0;
  document.querySelectorAll('.tea-pin').forEach(pin => {
    const show = (cat === 'All' || pin.dataset.type === cat);
    pin.style.display = show ? 'flex' : 'none';
    if (show) count++;
  });
  shownEl.textContent = count; hideTooltip();
}

async function loadMap() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson');
    const data = await res.json();
    projection.fitSize([1000, 500], data);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    data.features.forEach(f => {
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', geoPath(f)); p.setAttribute('class', 'country-path'); g.appendChild(p);
    });
    worldSvg.appendChild(g);
    buildPins();
    buildFilters();
  } catch (err) { console.error(err); }
  
  document.getElementById('zoom-in').onclick = () => { zoom *= 1.4; applyTransform(); };
  document.getElementById('zoom-out').onclick = () => { zoom = Math.max(1, zoom/1.4); applyTransform(); };
  document.getElementById('zoom-reset').onclick = () => { zoom=1; panX=0; panY=0; applyTransform(); };
  setTimeout(() => document.getElementById('intro').classList.add('hidden'), 600);
}

loadMap();
</script>
</body>
</html>
