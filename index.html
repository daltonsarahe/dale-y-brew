<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>World Tea Houses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0e1210;
      --ink-2: #1a1f1b;
      --ink-3: #242b25;
      --surface: #2a332b;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --tea: #76b48a;
      --tea-dim: rgba(118,180,138,0.18);
      --gold: #c9974a;
      --gold-dim: rgba(201,151,74,0.15);
      --cream: #ede9df;
      --muted: #8a9b8c;
      --ocean: #141e2b;
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--ink);
      color: var(--cream);
      overflow: hidden;
    }

    /* ─── HEADER ─── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      height: 64px;
      display: flex; align-items: center; gap: 16px;
      padding: 0 20px;
      background: rgba(14,18,16,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--tea-dim);
      border: 1px solid rgba(118,180,138,0.3);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 18px; height: 18px; }
    .logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 18px; color: var(--cream);
      white-space: nowrap;
    }
    .logo h1 span { color: var(--tea); }

    .search-wrap {
      flex: 1; max-width: 260px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      width: 14px; height: 14px;
      opacity: 0.4; pointer-events: none;
    }
    #search-input {
      width: 100%; height: 36px;
      background: var(--ink-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px 0 32px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--cream);
      transition: border-color 0.2s;
      outline: none;
    }
    #search-input::placeholder { color: var(--muted); }
    #search-input:focus { border-color: rgba(118,180,138,0.5); }

    /* ─── FILTER BAR ─── */
    #filter-bar {
      display: flex; align-items: center; gap: 6px;
      overflow-x: auto; scrollbar-width: none;
      margin-left: auto;
      padding-right: 4px;
    }
    #filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      display: flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--border-strong); color: var(--cream); }
    .filter-btn.active {
      background: var(--tea-dim);
      border-color: rgba(118,180,138,0.4);
      color: var(--tea);
    }
    .filter-count {
      background: rgba(255,255,255,0.08);
      color: var(--muted);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 20px;
      min-width: 18px;
      text-align: center;
    }
    .filter-btn.active .filter-count {
      background: rgba(118,180,138,0.2);
      color: var(--tea);
    }

    /* ─── MAP ─── */
    #map-wrap {
      position: fixed; top: 64px; left: 0; right: 0; bottom: 0;
      background: var(--ocean);
      cursor: grab;
      overflow: hidden;
    }
    #map-wrap.dragging { cursor: grabbing; }
    #map-stage { width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }

    .graticule { fill: none; stroke: rgba(255,255,255,0.03); stroke-width: 0.5px; }
    .country-path {
      fill: #1e2d21;
      stroke: #0e1210;
      stroke-width: 0.6px;
      transition: fill 0.2s;
    }
    .country-path:hover { fill: #2a3f2d; }
    .country-path.highlighted { fill: #2e4a33; }

    /* ─── PINS ─── */
    .tea-pin { cursor: pointer; pointer-events: all; }
    .pin-bg {
      transition: r 0.2s, opacity 0.2s;
    }
    .tea-pin:hover .pin-bg { r: 10; opacity: 1; }
    .tea-pin.selected .pin-bg { r: 12; opacity: 1; }

    .pin-ring {
      fill: none;
      stroke-width: 1.5;
      opacity: 0;
      transition: opacity 0.2s;
      r: 13;
    }
    .tea-pin.selected .pin-ring { opacity: 1; }

    .pin-pulse-anim {
      fill: none;
      animation: ripple 2.5s ease-out infinite;
    }
    @keyframes ripple {
      0% { r: 7; opacity: 0.5; stroke-width: 2; }
      100% { r: 22; opacity: 0; stroke-width: 0.5; }
    }
    .tea-pin.selected .pin-pulse-anim { animation-duration: 1.4s; }

    .pin-dot { pointer-events: none; }

    /* ─── SIDEBAR ─── */
    #sidebar {
      position: fixed; right: 0; top: 64px; bottom: 0;
      width: 320px;
      background: var(--ink-2);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
      display: flex; flex-direction: column;
    }
    #sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .sidebar-close {
      width: 28px; height: 28px;
      background: var(--ink-3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .sidebar-close:hover { color: var(--cream); border-color: var(--border-strong); }
    .sidebar-close svg { width: 12px; height: 12px; }

    .sidebar-type-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 100px;
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px; line-height: 1.25;
      color: var(--cream);
      margin-bottom: 4px;
    }
    .sidebar-city {
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
    }
    .sidebar-city svg { width: 11px; height: 11px; opacity: 0.6; }

    .sidebar-body { flex: 1; overflow-y: auto; padding: 20px; }
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-track { background: transparent; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-desc {
      font-size: 14px; line-height: 1.65;
      color: rgba(237,233,223,0.75);
      margin-bottom: 20px;
    }

    .sidebar-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--ink-3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .stat-value { font-size: 15px; font-weight: 500; color: var(--cream); }
    .stat-value.accent { color: var(--tea); }

    .sidebar-divider { height: 1px; background: var(--border); margin: 4px 0 16px; }

    .highlights-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
    .highlight-item {
      display: flex; gap: 10px;
      margin-bottom: 14px;
    }
    .highlight-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--tea-dim);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .highlight-icon svg { width: 14px; height: 14px; color: var(--tea); }
    .highlight-text { font-size: 13px; color: rgba(237,233,223,0.7); line-height: 1.5; }
    .highlight-text strong { color: var(--cream); font-weight: 500; }

    /* ─── CONTROLS ─── */
    .map-controls {
      position: fixed; bottom: 28px; right: 28px; z-index: 200;
      display: flex; flex-direction: column; gap: 6px;
    }
    #sidebar.open ~ .map-controls { right: 348px; }
    .ctrl-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--ink-2);
      color: var(--cream);
      cursor: pointer;
      font-size: 16px; font-weight: 400;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--ink-3); border-color: var(--border-strong); }
    .ctrl-btn svg { width: 14px; height: 14px; }

    /* ─── COUNTER ─── */
    #pin-counter {
      position: fixed; bottom: 28px; left: 20px; z-index: 200;
      font-size: 12px; color: var(--muted);
      background: var(--ink-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
    }
    #pin-counter strong { color: var(--cream); }

    /* ─── MOBILE ─── */
    @media (max-width: 640px) {
      header {
        height: auto;
        flex-wrap: wrap;
        padding: 12px 16px;
        gap: 10px;
      }
      .logo h1 { font-size: 16px; }
      .search-wrap { max-width: none; order: 3; width: 100%; }
      #filter-bar { order: 4; width: 100%; margin-left: 0; }
      #map-wrap { top: 130px; }
      #sidebar {
        top: 130px;
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--border);
      }
      .map-controls { bottom: 20px; right: 16px; }
      #sidebar.open ~ .map-controls { right: 16px; }
      #pin-counter { display: none; }
    }

    /* ─── TOOLTIP (fallback on hover for desktop) ─── */
    .map-tooltip {
      position: fixed; z-index: 400;
      background: var(--ink-2);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s, transform 0.15s;
      max-width: 200px;
    }
    .map-tooltip.visible { opacity: 1; transform: translateY(0); }
    .map-tooltip-name { font-weight: 500; color: var(--cream); margin-bottom: 2px; }
    .map-tooltip-city { font-size: 11px; color: var(--muted); }

    /* Category color maps */
    .badge-east   { background: rgba(118,180,138,0.14); color: #76b48a; }
    .badge-south  { background: rgba(201,151,74,0.14);  color: #c9974a; }
    .badge-middle { background: rgba(180,130,118,0.14); color: #c49080; }
    .badge-euro   { background: rgba(118,155,180,0.14); color: #76a4c8; }

    .pin-east   { fill: #76b48a; }
    .pin-south  { fill: #c9974a; }
    .pin-middle { fill: #c49080; }
    .pin-euro   { fill: #76a4c8; }
    .ring-east   { stroke: #76b48a; }
    .ring-south  { stroke: #c9974a; }
    .ring-middle { stroke: #c49080; }
    .ring-euro   { stroke: #76a4c8; }
    .ripple-east   { stroke: #76b48a; }
    .ripple-south  { stroke: #c9974a; }
    .ripple-middle { stroke: #c49080; }
    .ripple-euro   { stroke: #76a4c8; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 6h9c0 3.866-2.015 7-4.5 7S3 9.866 3 6z" stroke="#76b48a" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12 7c1.657 0 3-.672 3-1.5S13.657 4 12 4" stroke="#76b48a" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M7.5 13v2M5.5 15h4" stroke="#76b48a" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>World <span>Tea</span> Houses</h1>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M9.5 9.5L12.5 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <input type="text" id="search-input" placeholder="Search tea houses…" autocomplete="off" />
  </div>

  <div id="filter-bar" role="group" aria-label="Filter by category"></div>
</header>

<div id="map-wrap">
  <div id="map-stage">
    <svg id="world-svg" viewBox="0 0 1000 600"></svg>
  </div>
</div>

<div id="sidebar" role="complementary" aria-label="Tea house details">
  <div class="sidebar-header" id="sidebar-header"></div>
  <div class="sidebar-body" id="sidebar-body"></div>
</div>

<div class="map-tooltip" id="map-tooltip">
  <div class="map-tooltip-name" id="tt-name"></div>
  <div class="map-tooltip-city" id="tt-city"></div>
</div>

<div class="map-controls">
  <button class="ctrl-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in">
    <svg viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button class="ctrl-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out">
    <svg viewBox="0 0 14 14" fill="none"><path d="M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button class="ctrl-btn" id="zoom-reset" aria-label="Reset view" title="Reset view">
    <svg viewBox="0 0 14 14" fill="none"><rect x="2" y="2" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="2" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="8" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="8" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
  </button>
</div>

<div id="pin-counter"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  "East Asian":    { cls: "east",   label: "East Asian",    color: "#76b48a" },
  "South Asian":   { cls: "south",  label: "South Asian",   color: "#c9974a" },

  "European":      { cls: "euro",   label: "European",      color: "#76a4c8" }
};

const categories = Object.keys(categoryMeta);

// ─── STATE ───
let activeFilter = "All";
let searchQuery = "";
let selectedId = null;
let zoom = 1, panX = 0, panY = 0;
let isDragging = false, dragStart = {x:0,y:0}, panStart = {x:0,y:0};
let lastTouchDist = null;

const projection = d3.geoMercator();
const geoPath = d3.geoPath().projection(projection);
const mapWrap = document.getElementById('map-wrap');
const mapStage = document.getElementById('map-stage');
const svg = d3.select('#world-svg');
const sidebar = document.getElementById('sidebar');
const tooltip = document.getElementById('map-tooltip');

// ─── HELPERS ───
function visibleTeas() {
  return teaHouses.filter(t => {
    const matchCat = activeFilter === "All" || t.type === activeFilter;
    const matchSearch = !searchQuery || t.name.toLowerCase().includes(searchQuery) || t.city.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });
}

function updateTransform(animate = false) {
  mapStage.style.transition = animate ? 'transform 0.4s cubic-bezier(0.4,0,0.2,1)' : 'none';
  mapStage.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
}

function zoomToward(factor, cx, cy) {
  const newZoom = Math.min(8, Math.max(0.7, zoom * factor));
  panX = cx - (cx - panX) * (newZoom / zoom);
  panY = cy - (cy - panY) * (newZoom / zoom);
  zoom = newZoom;
  updateTransform();
}

// ─── DRAG & TOUCH ───
mapWrap.addEventListener('mousedown', e => {
  if (e.target.closest('.tea-pin')) return;
  isDragging = true;
  mapWrap.classList.add('dragging');
  dragStart = {x: e.clientX, y: e.clientY};
  panStart = {x: panX, y: panY};
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX = panStart.x + (e.clientX - dragStart.x);
  panY = panStart.y + (e.clientY - dragStart.y);
  updateTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  mapWrap.classList.remove('dragging');
});

// Wheel zoom
mapWrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  zoomToward(factor, e.clientX, e.clientY);
}, { passive: false });

// Touch pan + pinch-zoom
mapWrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    panStart = {x: panX, y: panY};
  }
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.hypot(dx, dy);
  }
}, { passive: true });
mapWrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    panX = panStart.x + (e.touches[0].clientX - dragStart.x);
    panY = panStart.y + (e.touches[0].clientY - dragStart.y);
    updateTransform();
  }
  if (e.touches.length === 2 && lastTouchDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    zoomToward(dist / lastTouchDist, cx, cy);
    lastTouchDist = dist;
  }
}, { passive: false });
mapWrap.addEventListener('touchend', () => { isDragging = false; lastTouchDist = null; });

// ─── CLUSTERING ───
const CLUSTER_RADIUS = 18;

function computeClusters(teas) {
  const placed = [];
  const clusters = [];
  teas.forEach(tea => {
    const coords = projection([tea.lng, tea.lat]);
    if (!coords) return;
    const [x, y] = coords;
    const existing = placed.find(p => Math.hypot(p.x - x, p.y - y) < CLUSTER_RADIUS);
    if (existing) {
      existing.teas.push(tea);
      existing.x = (existing.x * (existing.teas.length - 1) + x) / existing.teas.length;
      existing.y = (existing.y * (existing.teas.length - 1) + y) / existing.teas.length;
    } else {
      const c = { x, y, teas: [tea] };
      placed.push(c);
      clusters.push(c);
    }
  });
  return clusters;
}

let expandedCluster = null;
let clusterUid = 0;

function collapseExpanded() {
  if (!expandedCluster) return;
  const { uid, el } = expandedCluster;
  // Remove fan pins by their uid class, searched from the whole pin-layer
  d3.selectAll('.fan-pin-' + uid).remove();
  el.select('.cluster-shield').attr('opacity', 0.92);
  el.select('.cluster-label').attr('opacity', 1);
  expandedCluster = null;
}

// ─── PINS ───
function buildPins(pinLayer) {
  const clusters = computeClusters(teaHouses);

  clusters.forEach(cluster => {
    const { x, y, teas } = cluster;
    const isMulti = teas.length > 1;
    const m = categoryMeta[teas[0].type];
    const cls = m ? m.cls : 'east';

    const g = pinLayer.append('g')
      .attr('class', 'tea-pin cluster-pin')
      .attr('data-ids', teas.map(t => t.id).join(','))
      .attr('data-type', teas[0].type);

    if (!isMulti) {
      g.append('circle')
        .attr('class', `pin-pulse-anim ripple-${cls}`)
        .attr('cx', x).attr('cy', y);
    }

    const r = isMulti ? 11 : 7;
    g.append('circle')
      .attr('class', `cluster-shield pin-bg pin-${cls}`)
      .attr('cx', x).attr('cy', y)
      .attr('r', r)
      .attr('opacity', 0.92);

    if (isMulti) {
      g.append('text')
        .attr('class', 'cluster-label')
        .attr('x', x).attr('y', y)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('fill', '#0e1210')
        .attr('font-size', '9')
        .attr('font-weight', '700')
        .attr('font-family', 'DM Sans, sans-serif')
        .attr('pointer-events', 'none')
        .text(teas.length);
    } else {
      g.append('circle')
        .attr('cx', x).attr('cy', y).attr('r', 2.5)
        .attr('fill', '#0e1210').attr('opacity', 0.55)
        .attr('pointer-events', 'none');
    }

    g.on('click', function(e) {
      e.stopPropagation();
      tooltip.classList.remove('visible');

      if (isMulti) {
        if (expandedCluster && expandedCluster.cluster === cluster) {
          collapseExpanded();
          return;
        }
        collapseExpanded();

        const uid = ++clusterUid;
        const count = teas.length;
        const fanR = Math.max(32, 24 + count * 6);
        const angleStep = (Math.PI * 1.6) / Math.max(count - 1, 1);
        const startAngle = -Math.PI / 2 - ((count - 1) * angleStep / 2);
        // pinLayer is the parent SVG group for all pins
        const pinLayerEl = d3.select(this.closest('.pin-layer'));

        teas.forEach((tea, i) => {
          const angle = count === 1 ? -Math.PI / 2 : startAngle + i * angleStep;
          const fx = x + fanR * Math.cos(angle);
          const fy = y + fanR * Math.sin(angle);
          const tm = categoryMeta[tea.type];
          const tcls = tm ? tm.cls : 'east';

          const fp = pinLayerEl.append('g')
            .attr('class', `fan-pin tea-pin fan-pin-${uid}`)
            .attr('data-id', tea.id)
            .attr('data-type', tea.type)
            .attr('role', 'button')
            .attr('tabindex', 0)
            .attr('aria-label', `${tea.name}, ${tea.city}`);

          fp.append('line')
            .attr('x1', x).attr('y1', y)
            .attr('x2', fx).attr('y2', fy)
            .attr('stroke', tm ? tm.color : '#76b48a')
            .attr('stroke-width', 0.8)
            .attr('opacity', 0.3)
            .attr('pointer-events', 'none');

          fp.append('circle')
            .attr('class', `pin-bg pin-${tcls}`)
            .attr('cx', fx).attr('cy', fy)
            .attr('r', 7).attr('opacity', 0.92);

          fp.append('circle')
            .attr('cx', fx).attr('cy', fy).attr('r', 2.5)
            .attr('fill', '#0e1210').attr('opacity', 0.55)
            .attr('pointer-events', 'none');

          const cosA = Math.cos(angle);
          const labelX = fx + (cosA > 0.15 ? 11 : cosA < -0.15 ? -11 : 0);
          const labelAnchor = cosA > 0.15 ? 'start' : cosA < -0.15 ? 'end' : 'middle';
          const labelDy = Math.abs(cosA) < 0.15 ? (Math.sin(angle) < 0 ? -11 : 11) : 0;
          fp.append('text')
            .attr('x', labelX).attr('y', fy + labelDy)
            .attr('text-anchor', labelAnchor)
            .attr('dominant-baseline', 'central')
            .attr('fill', '#ede9df')
            .attr('font-size', '8.5')
            .attr('font-family', 'DM Sans, sans-serif')
            .attr('font-weight', '500')
            .attr('pointer-events', 'none')
            .text(tea.name.length > 22 ? tea.name.slice(0, 20) + '…' : tea.name);

          function onFanClick(ev) { ev.stopPropagation(); selectTea(tea.id); }
          fp.on('click', onFanClick);
          fp.on('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); onFanClick(ev); }});
          fp.on('mouseenter', ev => {
            document.getElementById('tt-name').textContent = tea.name;
            document.getElementById('tt-city').textContent = tea.city;
            tooltip.classList.add('visible');
            positionTooltip(ev);
          });
          fp.on('mousemove', positionTooltip);
          fp.on('mouseleave', () => tooltip.classList.remove('visible'));
        });

        d3.select(this).select('.cluster-shield').attr('opacity', 0.35);
        d3.select(this).select('.cluster-label').attr('opacity', 0.25);
        expandedCluster = { uid, el: d3.select(this), cluster };

      } else {
        selectTea(teas[0].id);
      }
    });

    if (!isMulti) {
      g.on('mouseenter', function(e) {
        if (teas[0].id === selectedId) return;
        document.getElementById('tt-name').textContent = teas[0].name;
        document.getElementById('tt-city').textContent = teas[0].city;
        tooltip.classList.add('visible');
        positionTooltip(e);
      });
      g.on('mousemove', positionTooltip);
      g.on('mouseleave', () => tooltip.classList.remove('visible'));
    } else {
      g.on('mouseenter', function(e) {
        if (expandedCluster && expandedCluster.cluster === cluster) return;
        const names = teas.map(t => t.name).join(', ');
        document.getElementById('tt-name').textContent = `${teas.length} tea houses`;
        document.getElementById('tt-city').textContent = names.length > 60 ? names.slice(0, 58) + '…' : names;
        tooltip.classList.add('visible');
        positionTooltip(e);
      });
      g.on('mousemove', positionTooltip);
      g.on('mouseleave', () => tooltip.classList.remove('visible'));
    }
  });
}

function positionTooltip(e) {
  const x = e.clientX + 14;
  const y = e.clientY - 10;
  tooltip.style.left = Math.min(x, window.innerWidth - 220) + 'px';
  tooltip.style.top = y + 'px';
}

function updatePinsVisibility() {
  const visible = new Set(visibleTeas().map(t => t.id));
  // Collapse any expanded cluster when visibility changes
  if (expandedCluster) {
    const clusterIds = expandedCluster.cluster.teas.map(t => t.id);
    const anyVisible = clusterIds.some(id => visible.has(id));
    if (!anyVisible) collapseExpanded();
  }
  document.querySelectorAll('.cluster-pin').forEach(pin => {
    const ids = (pin.getAttribute('data-ids') || '').split(',').map(Number);
    const anyVisible = ids.some(id => visible.has(id));
    pin.style.display = anyVisible ? '' : 'none';
  });
  // Fan pins (expanded cluster) — hide individually if visible
  document.querySelectorAll('.fan-pin').forEach(pin => {
    const id = parseInt(pin.getAttribute('data-id'));
    if (!visible.has(id)) pin.style.display = 'none';
  });
  const count = visible.size;
  document.getElementById('pin-counter').innerHTML = `<strong>${count}</strong> ${count === 1 ? 'tea house' : 'tea houses'}`;
}

// ─── SIDEBAR ───
function selectTea(id) {
  selectedId = id;
  const tea = teaHouses.find(t => t.id === id);
  const m = categoryMeta[tea.type];
  const cls = m ? m.cls : 'east';

  const header = document.getElementById('sidebar-header');
  header.innerHTML = `
    <div style="flex:1">
      <span class="sidebar-type-badge badge-${cls}">${tea.type}</span>
      <div class="sidebar-title">${tea.name}</div>
      <div class="sidebar-city">
        <svg viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5.5 1C3.567 1 2 2.567 2 4.5c0 2.5 3.5 5.5 3.5 5.5s3.5-3 3.5-5.5C9 2.567 7.433 1 5.5 1z" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="5.5" cy="4.5" r="1" fill="currentColor"/>
        </svg>
        ${tea.city}
      </div>
    </div>
    <button class="sidebar-close" id="sidebar-close" aria-label="Close panel">
      <svg viewBox="0 0 12 12" fill="none"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  `;

  const body = document.getElementById('sidebar-body');
  const highlightsHtml = (tea.highlights || []).map(h => `
    <div class="highlight-item">
      <div class="highlight-icon">
        <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M7 4.5v3l1.5 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="highlight-text"><strong>${h.label}:</strong> ${h.text}</div>
    </div>
  `).join('');

  body.innerHTML = `
    <p class="sidebar-desc">${tea.desc}</p>
    <div class="sidebar-stats">
      <div class="stat-card">
        <div class="stat-label">Founded</div>
        <div class="stat-value accent">${tea.founded}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Specialty</div>
        <div class="stat-value" style="font-size:12px;line-height:1.3">${tea.specialty}</div>
      </div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="highlights-title">Highlights</div>
    ${highlightsHtml}
  `;

  sidebar.classList.add('open');
  updatePinsVisibility();

  document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
}

function closeSidebar() {
  selectedId = null;
  sidebar.classList.remove('open');
  updatePinsVisibility();
}

// ─── FILTERS ───
function buildFilters() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  const counts = {};
  teaHouses.forEach(t => { counts[t.type] = (counts[t.type] || 0) + 1; });

  ['All', ...categories].forEach(cat => {
    const count = cat === 'All' ? teaHouses.length : (counts[cat] || 0);
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === activeFilter ? ' active' : '');
    btn.setAttribute('aria-pressed', cat === activeFilter ? 'true' : 'false');
    btn.innerHTML = `${cat} <span class="filter-count">${count}</span>`;
    btn.addEventListener('click', () => {
      activeFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      if (selectedId && !visibleTeas().find(t => t.id === selectedId)) closeSidebar();
      updatePinsVisibility();
    });
    bar.appendChild(btn);
  });
}

// ─── SEARCH ───
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.trim().toLowerCase();
  if (selectedId && !visibleTeas().find(t => t.id === selectedId)) closeSidebar();
  updatePinsVisibility();
});

// ─── ZOOM CONTROLS ───
const ww = () => window.innerWidth / 2;
const wh = () => (window.innerHeight - 64) / 2 + 64;
document.getElementById('zoom-in').addEventListener('click', () => { zoomToward(1.4, ww(), wh()); });
document.getElementById('zoom-out').addEventListener('click', () => { zoomToward(1/1.4, ww(), wh()); });
document.getElementById('zoom-reset').addEventListener('click', () => {
  zoom = 1; panX = 0; panY = 0;
  updateTransform(true);
});

// click on map to close sidebar/tooltip and collapse clusters
mapWrap.addEventListener('click', e => {
  if (!e.target.closest('.tea-pin')) {
    tooltip.classList.remove('visible');
    collapseExpanded();
  }
});

// ─── INIT ───
async function init() {
  try {
    const data = await d3.json('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson');
    const world = { ...data, features: data.features.filter(d => d.properties.name !== "Antarctica") };

    const mapEl = document.getElementById('map-wrap');
    const w = mapEl.clientWidth;
    const h = mapEl.clientHeight;

    // Sync SVG dimensions to container so nothing is clipped
    svg.attr('viewBox', `0 0 ${w} ${h}`)
       .attr('width', w)
       .attr('height', h);

    projection.fitSize([w, h], world);

    // Ocean rect
    svg.append('rect').attr('width', w).attr('height', h).attr('fill', 'var(--ocean)');

    // Graticule
    const graticule = d3.geoGraticule()();
    svg.append('path').datum(graticule).attr('class', 'graticule').attr('d', geoPath);

    // Countries
    svg.append('g').selectAll('path')
      .data(world.features).enter()
      .append('path').attr('d', geoPath).attr('class', 'country-path');

    // Pins
    const pinLayer = svg.append('g').attr('class', 'pin-layer');
    buildPins(pinLayer);
    buildFilters();
    updatePinsVisibility();

  } catch (err) {
    console.error("Map failed:", err);
    document.getElementById('map-wrap').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8a9b8c;font-size:14px;">
        Map data unavailable — please open via a local server or Firefox.
      </div>`;
  }
}

init();
</script>
